name: Web and contract checks

on:
  push:
    paths:
      - "apps/web/**"
      - "docs/**"
      - ".sync/**"
      - "scripts/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/**"
      - ".sync/**"
      - "scripts/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:no-desktop
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:codex-harness

  platform-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust format and tests
        working-directory: .
        run: |
          (cd apps/web && cargo fmt --all -- --check)
          ./scripts/test-web-rust.sh
      - name: Real PostgreSQL integration tests
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres owc_runner
          TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1/owc_runner \
            ./scripts/test-web-rust.sh \
              -p open-web-codex-run-orchestrator --test postgres -- --ignored
          # Every bootstrap scenario requires an empty database, even when run serially.
          ./scripts/test-web-rust.sh -p open-web-codex-server \
            --bin open-web-codex-server security_integration:: -- --ignored --list \
            > "$RUNNER_TEMP/security-tests.txt"
          mapfile -t security_tests < <(sed -n 's/^\(security_integration::.*\): test$/\1/p' "$RUNNER_TEMP/security-tests.txt")
          test "${#security_tests[@]}" -gt 0
          for index in "${!security_tests[@]}"; do
            database="owc_security_${index}"
            createdb -h 127.0.0.1 -U postgres "$database"
            TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1/$database" \
              ./scripts/test-web-rust.sh -p open-web-codex-server \
                --bin open-web-codex-server "${security_tests[$index]}" -- --ignored --exact
            dropdb -h 127.0.0.1 -U postgres "$database"
          done

  repository-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate shell and metadata
        run: |
          bash -n scripts/*.sh
          bash -n scripts/tests/*.sh
          jq empty .sync/codex-upstream.json
          git diff --check HEAD^ -- . ':(exclude)**/*.snap'
