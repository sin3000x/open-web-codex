name: Codex protocol drift checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: "./scripts/test-codex.sh -p codex-app-server-protocol schema_fixtures::"
        working-directory: .
