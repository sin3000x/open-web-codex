[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-codex-hello-agent"
version = "0.1.0"
description = "Minimal Python Tool and MCP Server for learning Codex Agent development"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["hello_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
