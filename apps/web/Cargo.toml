[workspace]
resolver = "2"
members = [
    "crates/codex-adapter",
    "crates/git-runtime",
    "crates/auth",
    "crates/approval-service",
    "crates/profile-host",
    "crates/profile-registry",
    "crates/platform-contracts",
    "crates/platform-store",
    "crates/provider-service",
    "crates/run-orchestrator",
    "crates/secret-store",
    "server",
]

[workspace.dependencies]
async-trait = "0.1"
argon2 = "0.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "set-header", "trace"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
 clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
hex = "0.4"
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "1.8.0", default-features = false }
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
libc = "0.2"
url = "2"
base64 = "0.22"
ring = "0.17"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
tempfile = "3"
toml_edit = { version = "0.23", features = ["serde"] }

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.ci-test]
inherits = "test"
opt-level = 0
debug = "limited"
incremental = false
