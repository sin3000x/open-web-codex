name = "warehouse_single_agent"
description = "Prepare warehouse data, calculate network options, and deliver maps in one business assistant."
instructions = """
你是仓网业务助手，不是软件开发助手。独立完成数据准备、仓网分析和地图交付。回答简洁、结论优先，并严格区分已确认事实、推断和无法确认的内容。
"""
include_permissions_instructions = false
include_apps_instructions = false
include_collaboration_mode_instructions = false
developer_instructions = """
你是单 Agent 仓网 Root，按本次目标使用数据准备、仓网规划和地图 Skill。
需要的工具已经可用时直接调用；不可见时按准确工具名 `tool_search` 一次，新一轮对话或恢复本身不是重复搜索的理由；仍不可用就如实停止。
业务数据只来自用户授权的文件和数据、规划工具的结果，不用 Git、资源枚举、旧报告、预览行或模型文字重建。数量、分布、清单和汇总等数据事实问题，用 `query_prepared_network_input` 在已准备数据上精确回答。
只有用户明确要求脚本核算时，才可用 shell 或 Python 读取准确的 `prepared_input_relative_path`，并在 `outputs/warehouse-network/calculations/` 同时保存可复用的 `.py` 脚本和 `.json` 结果，交给规划工具复核；不读取原始文件，不覆盖已有文件。
最终回复遵守 `$warehouse-single-agent` 中“面向用户的回答”。
"""
nickname_candidates = ["Atlas"]

[features]
shell_tool = true
multi_agent = false

[skills.bundled]
enabled = false

[[skills.config]]
name = "warehouse-single-agent"
enabled = true

[[skills.config]]
name = "warehouse-data-preparation"
enabled = true

[[skills.config]]
name = "warehouse-single-network-planning"
enabled = true

[[skills.config]]
name = "warehouse-single-map-delivery"
enabled = true

[plugins.supply_chain]
enabled = true

[plugins.supply_chain.mcp_servers.supply_chain_data]
enabled = true
required = true
default_tools_approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain]
enabled = true
required = true
default_tools_approval_mode = "prompt"

[plugins.supply_chain.mcp_servers.supply_chain.tools.prepare_route_matrix]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.create_navigation_matrix_request]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.import_navigation_matrix]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.plan_cost_matrix]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.prepare_network_distribution_map]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.prepare_network_comparison_map]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.prepare_network_coverage_map]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.evaluate_network_baseline]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.assess_facility_change]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.solve_p_median]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.compare_network_scenarios]
approval_mode = "approve"

[plugins.supply_chain.mcp_servers.supply_chain.tools.publish_network_planning_report]
approval_mode = "approve"

[plugins.map_utils]
enabled = true

[plugins.map_utils.mcp_servers.map_utils]
enabled = true
default_tools_approval_mode = "prompt"

[plugins.map_utils.mcp_servers.map_utils.tools.create_map_card]
approval_mode = "approve"

[plugins.map_utils.mcp_servers.map_utils.tools.create_network_map_card]
approval_mode = "approve"

[plugins.map_utils.mcp_servers.map_utils.tools.revise_map_card]
approval_mode = "approve"
